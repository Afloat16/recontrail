[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recontrail"
version = "0.1.0"
description = "Local-first CPU photogrammetry: capture checks, sparse 3D reconstruction, calibrated stereo and offline reports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "ReconTrail contributors"}]
keywords = ["3d-reconstruction", "photogrammetry", "structure-from-motion", "stereo-vision", "point-cloud", "computer-vision", "camera-calibration", "colmap", "local-first", "offline", "cpu", "image-quality", "reproducibility", "python"]

dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "opencv-python-headless>=4.8,<5", "Pillow>=10.4,<13", "filelock>=3.13,<4"]

[project.urls]
Homepage = "https://github.com/Afloat16/recontrail"
Repository = "https://github.com/Afloat16/recontrail"
Documentation = "https://github.com/Afloat16/recontrail/blob/main/docs/USAGE.en.md"
Issues = "https://github.com/Afloat16/recontrail/issues"
Changelog = "https://github.com/Afloat16/recontrail/blob/main/CHANGELOG.md"

[project.optional-dependencies]
colmap = ["pycolmap>=4.2,<4.3"]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1.2", "httpx>=0.27"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
recontrail = "recontrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recontrail = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: end-to-end reconstruction using actual feature matching", "optional: optional dependency integration"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
