name: Optional COLMAP integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  colmap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,colmap]"
      - run: python -m pytest -q -m optional
